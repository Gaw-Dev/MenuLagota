<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi Karyawan Lagota</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --bg-color: #f4f7f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .camera-box {
            text-align: center;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            margin-bottom: 10px;
        }
        video, canvas {
            width: 100%;
            max-height: 300px;
            display: block;
            object-fit: cover;
        }
        canvas { display: none; }
        .btn {
            background-color: var(--accent-color);
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover { background-color: #219653; }
        .btn-camera {
            background-color: #2980b9;
            margin-bottom: 10px;
        }
        .btn-camera:hover { background-color: #1f618d; }
        .info-realtime {
            background: #eaf2f8;
            border: 1px solid #a4b0be;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #2c3e50;
        }
        #loading {
            display: none;
            text-align: center;
            margin-top: 10px;
            color: #e67e22;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Absensi Lagota</h2>
    <form id="absensiForm">
        <div class="form-group">
            <label for="nama">Nama Karyawan:</label>
            <input type="text" id="nama" required placeholder="Masukkan nama lengkap">
        </div>

        <div class="form-group">
            <label for="posisi">Posisi:</label>
            <select id="posisi" required>
                <option value="">-- Pilih Posisi --</option>
                <option value="Leader">Leader</option>
                <option value="Waiter">Waiter</option>
                <option value="Kitchen">Kitchen</option>
                <option value="Bar">Bar</option>
                <option value="Lain-lain">Lain-lain</option>
            </select>
        </div>

        <div class="form-group">
            <label for="tipeAbsen">Tipe Absen:</label>
            <select id="tipeAbsen" required>
                <option value="">-- Pilih Masuk / Pulang --</option>
                <option value="Masuk">Masuk</option>
                <option value="Pulang">Pulang</option>
            </select>
        </div>

        <div class="form-group">
            <label for="shift">Shift / Jenis Kerja:</label>
            <select id="shift" required>
                <option value="">-- Pilih Shift --</option>
                <option value="Shift 1">Shift 1</option>
                <option value="Shift 2">Shift 2</option>
                <option value="Lembur">Lembur</option>
            </select>
        </div>

        <div class="info-realtime">
            <strong>Waktu Saat Ini (Otomatis):</strong> <span id="waktuLive">-</span>
        </div>

        <div class="form-group">
            <label>Foto Langsung (Live Camera):</label>
            <div class="camera-box">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas"></canvas>
                <img id="photoResult" style="width:100%; display:none;" alt="Hasil Foto">
            </div>
            <button type="button" id="snapBtn" class="btn btn-camera">Ambil Foto Sekarang</button>
            <button type="button" id="retakeBtn" class="btn btn-camera" style="display:none; background-color: #c0392b;">Foto Ulang</button>
        </div>

        <button type="submit" class="btn">Kirim Absensi</button>
        <div id="loading">Mengirim data dan foto ke Spreadsheet... Mohon tunggu.</div>
    </form>
</div>

<script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzx6CWY6ScmyyOGOUjtux5z---635CkDn5h0IpIYpSsfdqCWFTNUybtwcrCN22Iq-aK/exec';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const photoResult = document.getElementById('photoResult');
    const snapBtn = document.getElementById('snapBtn');
    const retakeBtn = document.getElementById('retakeBtn');
    const waktuLive = document.getElementById('waktuLive');
    
    let base64Image = "";

    // Jam Real-Time Berjalan
    setInterval(() => {
        const now = new Date();
        waktuLive.innerText = now.toLocaleString('id-ID');
    }, 1000);

    // Aktifkan Kamera Langsung
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
        .then(stream => { video.srcObject = stream; })
        .catch(err => { alert("Gagal membuka kamera. Pastikan izin kamera aktif."); });

    snapBtn.addEventListener('click', () => {
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        base64Image = canvas.toDataURL('image/jpeg');
        photoResult.src = base64Image;
        photoResult.style.display = 'block';
        video.style.display = 'none';
        
        snapBtn.style.display = 'none';
        retakeBtn.style.display = 'block';
        
        let stream = video.srcObject;
        if(stream) stream.getTracks().forEach(track => track.stop());
    });

    retakeBtn.addEventListener('click', () => {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
            .then(stream => {
                video.srcObject = stream;
                video.style.display = 'block';
                photoResult.style.display = 'none';
                retakeBtn.style.display = 'none';
                snapBtn.style.display = 'block';
                base64Image = "";
            });
    });

    const form = document.getElementById('absensiForm');
    const loading = document.getElementById('loading');

    form.addEventListener('submit', e => {
        e.preventDefault();

        if(!base64Image) {
            alert("Harap ambil foto lewat kamera terlebih dahulu!");
            return;
        }

        loading.style.display = 'block';

        const data = {
            nama: document.getElementById('nama').value,
            posisi: document.getElementById('posisi').value,
            tipeAbsen: document.getElementById('tipeAbsen').value,
            shift: document.getElementById('shift').value,
            foto: base64Image
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(() => {
            loading.style.display = 'none';
            alert("Absensi berhasil disimpan di kolom yang sesuai!");
            form.reset();
            location.reload();
        })
        .catch(error => {
            loading.style.display = 'none';
            alert("Terjadi kesalahan saat mengirim data.");
            console.error('Error!', error.message);
        });
    });
</script>

</body>
</html>
